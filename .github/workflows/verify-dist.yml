name: Verify dists are up to date
description: >
  Verify that the checked-in `dist/` of every bundled JS action is up to date with its source.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: check-dist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Discover every directory whose package.json defines a `bundle` script, so
  # each bundled action is verified individually and new ones are picked up
  # automatically without editing this workflow.
  discover-actions:
    name: Discover actions
    runs-on: ubuntu-arm64
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Find actions with a bundle script
        id: find
        run: |
          dirs=$(find . -name package.json -not -path '*/node_modules/*' -print0 \
            | xargs -0 -I{} sh -c 'jq -e ".scripts.bundle" "{}" >/dev/null 2>&1 && dirname "{}"' \
            | sed 's|^\./||' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Bundled actions found: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  verify-dist:
    name: Verify dist
    needs:
      - discover-actions
    if: needs.discover-actions.outputs.dirs != '[]'
    runs-on: ubuntu-arm64
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.discover-actions.outputs.dirs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ matrix.dir }}/.nvmrc
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Verify dist is up to date
        run: make check-drift ACTION="$ACTION_DIR"
        env:
          ACTION_DIR: ${{ matrix.dir }}

  # The matrix check names change with the discovered actions, so branch
  # protection requires this single stable check instead.
  verify-dist-complete:
    name: Verify dist complete
    needs:
      - discover-actions
      - verify-dist
    if: always()
    runs-on: ubuntu-arm64-small
    steps:
      - name: Check results
        env:
          DISCOVER_RESULT: ${{ needs.discover-actions.result }}
          VERIFY_RESULT: ${{ needs.verify-dist.result }}
        run: |
          echo "discover-actions: $DISCOVER_RESULT, verify-dist: $VERIFY_RESULT"
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Discovering bundled actions failed, see the 'Discover actions' job log."
            exit 1
          fi
          case "$VERIFY_RESULT" in
            success|skipped) exit 0 ;;
            *)
              echo "::error::A 'Verify dist (<action>)' job failed: that action's checked-in dist/ is stale. Check out the branch, run 'make bundle ACTION=<action>' with the action's pinned Node version (.nvmrc), and commit the regenerated dist/. The failing job's log names the exact command. For Renovate PRs, apply the dependency update together with the rebuilt dist/ on a branch of your own instead: renovate/** branches are write-locked."
              exit 1 ;;
          esac
