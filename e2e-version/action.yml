name: 'Grafana E2E version resolver'
description: 'Resolve Grafana versions for use in E2E tests'

inputs:
  skip-grafana-nightly-image:
    default: false
    required: false
    description: 'Optionally, you can skip the Grafana nightly image'
    type: boolean
  skip-grafana-dev-image:
    default: false
    required: false
    description: 'Deprecated: use skip-grafana-nightly-image instead'
    deprecationMessage: 'skip-grafana-dev-image is deprecated, use skip-grafana-nightly-image instead'
    type: boolean
  version-resolver-type:
    required: true
    type: choice
    default: plugin-grafana-dependency
    description: >
     Choose between different version resolver types.
      plugin-grafana-dependency: Resolve versions based on the Grafana version specified in the plugin.json file.
      version-support-policy: Resolve versions according to Grafana's plugin compatibility policy. I.e. the latest major version and the last minor of the previous major version.
    options: 
      - plugin-grafana-dependency
      - version-support-policy
  grafana-dependency:
    required: false
    description: 'Optionally, use this input to pass a semver range of supported Grafana versions to test against. This is only used when version-resolver-type is plugin-grafana-dependency. If not provided, the action will try to read grafanaDependency from the plugin.json file.'
    type: string
  plugin-directory:
    required: false
    description: 'Only applies when version-resolver-type is plugin-grafana-dependency and grafana-dependency is not set. Path to the plugin root directory containing src/plugin.json. Defaults to the repository root. Useful when the plugin is in a subdirectory (e.g. plugin).'
    type: string
  limit:
    required: false
    description: 'The maximum number of versions to resolve. Default is 6, 0 means no limit.'
    default: "6"

outputs:
  matrix:
    description: 'Versions to test against'
    value: ${{ steps.resolve.outputs.matrix }}

runs:
  using: composite
  steps:
    # setup-node resolves node-version-file against GITHUB_WORKSPACE, not the action's own directory
    - name: Read Node.js version
      id: node-version
      shell: bash
      run: echo "version=$(cat "$GITHUB_ACTION_PATH/.nvmrc")" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.node-version.outputs.version }}
        package-manager-cache: false

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund

    # Composite actions don't set INPUT_* for their inputs, so pass them the way @actions/core reads them
    - name: Resolve versions
      id: resolve
      shell: bash
      env:
        INPUT_SKIP-GRAFANA-NIGHTLY-IMAGE: ${{ inputs.skip-grafana-nightly-image }}
        INPUT_SKIP-GRAFANA-DEV-IMAGE: ${{ inputs.skip-grafana-dev-image }}
        INPUT_VERSION-RESOLVER-TYPE: ${{ inputs.version-resolver-type }}
        INPUT_GRAFANA-DEPENDENCY: ${{ inputs.grafana-dependency }}
        INPUT_PLUGIN-DIRECTORY: ${{ inputs.plugin-directory }}
        INPUT_LIMIT: ${{ inputs.limit }}
      run: node "$GITHUB_ACTION_PATH/index.mjs"
